name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/micro-acp .
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
